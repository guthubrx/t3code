      width: 100%;
      height: auto;
      max-height: 590px;
      object-fit: contain;
      cursor: zoom-in;

      margin: 0;
      max-height: 590px;
      overflow: auto;

    #caption {
      font-size: 18px;
      margin: 12px 0 6px;

      margin: 8px 0;
      display: grid;
      grid-template-columns: 75px 1fr;
      gap: 5px 10px;
    }
    dt {
      font-weight: 600;
    }
    dd {
      margin: 0;
    }
    #badge {
      font-weight: 600;
    }
    #frame:fullscreen {
      background: #18232c;
      padding: 25px;
      color: white;
      overflow: auto;
    }
    #frame:fullscreen #shot {
      max-height: 75vh;
    }
    dialog {
      border: 0;
      padding: 15px;
      max-width: 98vw;
      max-height: 98vh;
      background: #fff;
    }
    dialog img {
      display: block;
      max-width: none;
    }
    dialog .tools {
      position: sticky;
      top: 0;
    }
    #zoom {
      max-width: 95vw;
      overflow: auto;
    }
    .small {
      font-size: 12px;
    }
    #stage {
      position: relative;
    }
    #pointer {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      width: 28px;
      height: 34px;
      filter: drop-shadow(0 1px 2px #0008);
    }
    .ripple {
      position: absolute;
      width: 42px;
      height: 42px;
      left: -21px;
      top: -21px;
      border: 3px solid #ff6b00;
      border-radius: 50%;
      background: #ffb30033;
      animation: clickPulse 1s ease-out 2;
    }
    @keyframes clickPulse {
      0% {
        transform: scale(0.35);
        opacity: 1;
      }
      100% {
        transform: scale(1.5);
        opacity: 0.25;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .ripple {
        animation: none;
      }
    }
  </style>

  <script>
    "use strict";
    const data = JSON.parse(document.getElementById("data").textContent),
      $ = (id) => document.getElementById(id);
    let index = 0,
      timer = null;
    $("context").textContent = data.title + " · " + data.environment;
    data.steps.forEach((step, i) => {
      const o = document.createElement("option");
      o.value = i;
      o.textContent = i + 1 + " — " + step.caption;
      $("select").append(o);
    });
    function pause() {
      if (timer) clearInterval(timer);
      timer = null;
      $("play").textContent = "Lecture";
    }
    function placePointer() {
      const s = data.steps[index],
        p = s.pointer,
        img = $("shot");
      $("pointer").hidden = !p || s.imageIndex === undefined;
      if (!p || !img.naturalWidth) return;
      const w = img.clientWidth,
        h = img.clientHeight,
        k = Math.min(w / img.naturalWidth, h / img.naturalHeight);
      $("pointer").style.left =
        (w - img.naturalWidth * k) / 2 + (p.x / p.viewportWidth) * img.naturalWidth * k + "px";
      $("pointer").style.top =
        (h - img.naturalHeight * k) / 2 + (p.y / p.viewportHeight) * img.naturalHeight * k + "px";
      const pulse = $("pointer").querySelector(".ripple");
      pulse.style.animation = "none";
      void pulse.offsetWidth;
      pulse.style.animation = "";
    }
    $("shot").addEventListener("load", placePointer);
    new ResizeObserver(placePointer).observe($("stage"));
    function show() {
      const s = data.steps[index];
      $("select").value = index;
      $("counter").textContent = index + 1 + " / " + data.steps.length;
      $("caption").textContent = s.correction + " · " + s.caption;
      $("expected").textContent = s.expected;
      $("observed").textContent = s.observed;
      $("badge").textContent = {
        verified: "✓ Vérifié",
        failed: "✗ Échec",
        unverified: "○ Non vérifié",
      }[s.status];
      $("shot").hidden = s.imageIndex === undefined;
      $("technical").hidden = s.imageIndex !== undefined;
      if (s.imageIndex !== undefined) {
        $("shot").src = data.images[s.imageIndex];
        $("shot").alt = s.caption;
      } else $("technical").textContent = "Preuve technique\n\n" + s.text;
      $("prev").disabled = index === 0;
      $("next").disabled = index === data.steps.length - 1;
      placePointer();
    }
    function move(i) {
      pause();
      index = Math.max(0, Math.min(data.steps.length - 1, i));
      show();
    }
    function play() {
      if (timer) {
        pause();
        return;
      }
      if (index === data.steps.length - 1) index = 0;
      show();
      $("play").textContent = "Pause";
      timer = setInterval(() => {
        if (index < data.steps.length - 1) {
          index++;
          show();
        } else pause();
      }, data.seconds * 1000);
    }
    $("prev").onclick = () => move(index - 1);
    $("next").onclick = () => move(index + 1);
    $("play").onclick = play;
    $("select").onchange = (e) => move(Number(e.target.value));
    $("full").onclick = async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await $("frame").requestFullscreen();
      } catch {
        $("counter").textContent = "Plein écran indisponible ici ; ouvrir le fichier HTML.";
      }
    };
    $("shot").onclick = () => {
      pause();
      $("large").src = $("shot").src;
      $("zoom").showModal();
    };
    $("close").onclick = () => $("zoom").close();
    document.addEventListener("keydown", (e) => {
      if (["INPUT", "SELECT", "TEXTAREA", "BUTTON"].includes(e.target.tagName) || $("zoom").open)
        return;
      if (e.key === "ArrowRight") {
        e.preventDefault();
        move(index + 1);
      }
      if (e.key === "ArrowLeft") {
        e.preventDefault();
        move(index - 1);
      }
      if (e.code === "Space") {
        e.preventDefault();
        play();
      }
    });
    show();
    pause();
  </script>
