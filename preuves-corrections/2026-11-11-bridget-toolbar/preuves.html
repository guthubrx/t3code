<!doctype html>
<html lang="fr">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Sous-agents Bridget : bandeau compact</title>
  <style>
    [hidden] {
      display: none !important;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font:
        15px system-ui,
        sans-serif;
      color: var(--foreground, #182c3c);
      background: transparent;
    }
    button,
    select {
      font: inherit;
      padding: 8px 12px;
      border: 1px solid var(--border, #ccd4da);
      border-radius: 7px;
      background: var(--card, #fff);
      color: inherit;
      cursor: pointer;
    }
    button:focus-visible,
    select:focus-visible {
      outline: 3px solid #07828a;
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 12px 0;
    }
    .context {
      color: var(--muted-foreground, #526373);
      font-size: 13px;
    }
    figure {
      margin: 0;
      background: var(--card, #edf1f4);
      padding: 16px;
      border-radius: 10px;
    }
    #shot {
      display: block;
      width: 100%;
      height: auto;
      max-height: 590px;
      object-fit: contain;
      cursor: zoom-in;
    }
    #technical {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 0;
      max-height: 590px;
      overflow: auto;
    }
    #caption {
      font-size: 18px;
      margin: 12px 0 6px;
    }
    dl {
      margin: 8px 0;
      display: grid;
      grid-template-columns: 75px 1fr;
      gap: 5px 10px;
    }
    dt {
      font-weight: 600;
    }
    dd {
      margin: 0;
    }
    #badge {
      font-weight: 600;
    }
    #frame:fullscreen {
      background: #18232c;
      padding: 25px;
      color: white;
      overflow: auto;
    }
    #frame:fullscreen #shot {
      max-height: 480px;
    }
    dialog {
      border: 0;
      padding: 15px;
      max-width: 100%;
      max-height: 800px;
      background: #fff;
    }
    dialog img {
      display: block;
      max-width: none;
    }
    dialog .tools {
      position: sticky;
      top: 0;
    }
    #zoom {
      max-width: 100%;
      overflow: auto;
    }
    .small {
      font-size: 12px;
    }
    #stage {
      position: relative;
    }
    #pointer {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      width: 28px;
      height: 34px;
      filter: drop-shadow(0 1px 2px #0008);
    }
    .ripple {
      position: absolute;
      width: 42px;
      height: 42px;
      left: -21px;
      top: -21px;
      border: 3px solid #ff6b00;
      border-radius: 50%;
      background: #ffb30033;
      animation: clickPulse 1s ease-out 2;
    }
    @keyframes clickPulse {
      0% {
        transform: scale(0.35);
        opacity: 1;
      }
      100% {
        transform: scale(1.5);
        opacity: 0.25;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .ripple {
        animation: none;
      }
    }

    html,
    body {
      background: transparent;
      color: var(--foreground);
      font-family: var(--font-sans);
      padding: 0;
      margin: 0;
    }

    #shot {
      max-height: 480px;
    }
  </style>
  <main id="frame">
    <p class="context" id="context"></p>
    <div class="tools">
      <button id="prev" aria-label="Étape précédente">←</button><button id="play">Pause</button
      ><button id="next" aria-label="Étape suivante">→</button
      ><label
        >Étape
        <select id="select"></select></label
      ><button id="full">Plein écran</button><span id="counter" class="small"></span>
    </div>
    <figure>
      <div id="stage">
        <img id="shot" alt="" />
        <div id="pointer" hidden aria-hidden="true">
          <span class="ripple"></span
          ><svg width="28" height="34" viewBox="0 0 28 34">
            <path
              d="M2 2 L2 26 L9 20 L15 32 L21 29 L15 18 L25 18 Z"
              fill="#fff"
              stroke="#111"
              stroke-width="2"
            />
          </svg>
        </div>
      </div>
      <pre id="technical" hidden></pre>
    </figure>
    <h2 id="caption"></h2>
    <span id="badge"></span>
    <dl>
      <dt>Attendu</dt>
      <dd id="expected"></dd>
      <dt>Observé</dt>
      <dd id="observed"></dd>
    </dl>
    <p class="context small">
      Curseur et cercle orange : clic réel enregistré · Deux secondes par étape · Flèches pour
      naviguer · Espace pour pause · Cliquer sur une capture pour l’agrandir.
    </p>
  </main>
  <dialog id="zoom">
    <div class="tools"><button id="close">Fermer le zoom</button></div>
    <img id="large" alt="Capture agrandie" />
  </dialog>

  <script>
    "use strict";
    const data = JSON.parse(document.getElementById("data").textContent),
      $ = (id) => document.getElementById(id);
    let index = 0,
      timer = null;
    $("context").textContent = data.title + " · " + data.environment;
    data.steps.forEach((step, i) => {
      const o = document.createElement("option");
      o.value = i;
      o.textContent = i + 1 + " : " + step.caption;
      $("select").append(o);
    });
    function pause() {
      if (timer) clearInterval(timer);
      timer = null;
      $("play").textContent = "Lecture";
    }
    function placePointer() {
      const s = data.steps[index],
        p = s.pointer,
        img = $("shot");
      $("pointer").hidden = !p || s.imageIndex === undefined;
      if (!p || !img.naturalWidth) return;
      const w = img.clientWidth,
        h = img.clientHeight,
        k = Math.min(w / img.naturalWidth, h / img.naturalHeight);
      $("pointer").style.left =
        (w - img.naturalWidth * k) / 2 + (p.x / p.viewportWidth) * img.naturalWidth * k + "px";
      $("pointer").style.top =
        (h - img.naturalHeight * k) / 2 + (p.y / p.viewportHeight) * img.naturalHeight * k + "px";
      const pulse = $("pointer").querySelector(".ripple");
      pulse.style.animation = "none";
      void pulse.offsetWidth;
      pulse.style.animation = "";
    }
    $("shot").addEventListener("load", placePointer);
    new ResizeObserver(placePointer).observe($("stage"));
    function show() {
      const s = data.steps[index];
      $("select").value = index;
      $("counter").textContent = index + 1 + " / " + data.steps.length;
      $("caption").textContent = s.correction + " · " + s.caption;
      $("expected").textContent = s.expected;
      $("observed").textContent = s.observed;
      $("badge").textContent = {
        verified: "✓ Vérifié",
        failed: "✗ Échec",
        unverified: "○ Non vérifié",
      }[s.status];
      $("shot").hidden = s.imageIndex === undefined;
      $("technical").hidden = s.imageIndex !== undefined;
      if (s.imageIndex !== undefined) {
        $("shot").src = data.images[s.imageIndex];
        $("shot").alt = s.caption;
      } else $("technical").textContent = "Preuve technique\n\n" + s.text;
      $("prev").disabled = index === 0;
      $("next").disabled = index === data.steps.length - 1;
      placePointer();
    }
    function move(i) {
      pause();
      index = Math.max(0, Math.min(data.steps.length - 1, i));
      show();
    }
    function play() {
      if (timer) {
        pause();
        return;
      }
      if (index === data.steps.length - 1) index = 0;
      show();
      $("play").textContent = "Pause";
      timer = setInterval(() => {
        if (index < data.steps.length - 1) {
          index++;
          show();
        } else pause();
      }, data.seconds * 1000);
    }
    $("prev").onclick = () => move(index - 1);
    $("next").onclick = () => move(index + 1);
    $("play").onclick = play;
    $("select").onchange = (e) => move(Number(e.target.value));
    $("full").onclick = async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await $("frame").requestFullscreen();
      } catch {
        $("counter").textContent = "Plein écran indisponible ici ; ouvrir le fichier HTML.";
      }
    };
    $("shot").onclick = () => {
      pause();
      $("large").src = $("shot").src;
      $("zoom").showModal();
    };
    $("close").onclick = () => $("zoom").close();
    document.addEventListener("keydown", (e) => {
      if (["INPUT", "SELECT", "TEXTAREA", "BUTTON"].includes(e.target.tagName) || $("zoom").open)
        return;
      if (e.key === "ArrowRight") {
        e.preventDefault();
        move(index + 1);
      }
      if (e.key === "ArrowLeft") {
        e.preventDefault();
        move(index - 1);
      }
      if (e.code === "Space") {
        e.preventDefault();
        play();
      }
    });
    show();
    pause();
  </script>
